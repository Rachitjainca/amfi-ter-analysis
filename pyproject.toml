[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "amfi-ter-analysis"
version = "2.0.0"
description = "Track daily changes in mutual fund Total Expense Ratios (TER) published by AMFI and notify Google Chat."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Rachit Jain"}]
dependencies = [
    "pandas>=2.0",
    "openpyxl>=3.1",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.urls]
Repository = "https://github.com/Rachitjainca/amfi-ter-analysis"

[project.scripts]
amfi-ter = "amfi_ter_analysis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
